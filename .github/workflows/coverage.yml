name: Coverage

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ '**' ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'

jobs:
  coverage-linux:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Install dependencies
      run: |
        sudo apt-get install ninja-build
        pip install gcovr
        gcovr --version
    - name: Build
      run: |
        mkdir build
        cmake . -B build -DSIMFIL_WITH_COVERAGE=YES -DSIMFIL_WITH_TESTS=YES -DCMAKE_BUILD_TYPE=Debug -DSIMFIL_FPIC=YES -DSIMFIL_SHARED=NO -DSIMFIL_WITH_COVERAGE=YES -GNinja
        cmake --build build
    - name: Run CTest
      working-directory: build/test
      run: |
        ctest --verbose --output-junit result-junit.xml
    - name: Run Gcovr
      run: |
        mkdir coverage
        gcovr --html-details coverage/coverage.html \
              --exclude-lines-by-pattern 'TRY_EXPECTED' \
              --filter src/ --filter include/
        gcovr --cobertura coverage.xml \
              --exclude-lines-by-pattern 'TRY_EXPECTED' \
              --html coverage.html \
              --filter src/ --filter include/
        less coverage.xml

    - name: Publish Coverage HTML
      uses: actions/upload-artifact@v4
      with:
        name: Test Coverage
        path: coverage

    - name: Code Coverage Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage.xml
        badge: false
        fail_below_min: false
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '50 80'

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md
